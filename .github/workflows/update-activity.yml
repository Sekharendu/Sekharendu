name: Update activity graph

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-activity.mjs
      - .github/workflows/update-activity.yml

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate graph from GitHub contributions
        run: node scripts/update-activity.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update activity graph"
            git pull --rebase origin main
            git push
          fi
